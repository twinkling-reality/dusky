name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runs against real Chrome with the WebMCP testing flag, which is the
      # documented way to enable it. If this job fails the protocol integration
      # is broken, whatever the unit tests say.
      - run: npx playwright install --with-deps chrome
      - run: pnpm test:e2e
      # Always, not just on failure. A test that passes on retry is reported
      # as flaky rather than failed, and its trace is the only way to find out
      # why. Uploading only on failure threw exactly that evidence away.
      #
      # Both paths: the HTML report renders the run, and `test-results/` holds
      # the traces and error contexts the report links to. Uploading only the
      # former is what left four failed runs with no attachment at all.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
