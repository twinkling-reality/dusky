<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dusky</title>
    <meta name="description" content="A browser for a web made of tools instead of pages." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@200;300;400;500&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      // Before paint. React setting this in an effect would show one frame of
      // the wrong palette, which looks like a rendering bug, not a preference.
      let stored = null;
      try {
        stored = localStorage.getItem("dusky.theme");
      } catch {}
      if (stored === "light" || stored === "dark") {
        document.documentElement.dataset.theme = stored;
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
